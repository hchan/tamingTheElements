name: Secrets

# gitleaks over full history. Historical findings are baselined by fingerprint in .gitleaksignore
# (see SECURITY.md); anything new fails the job. Output is always redacted.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          d="$(mktemp -d)"
          curl -fsSL -o "$d/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $d/gl.tgz" | sha256sum -c -
          tar -xzf "$d/gl.tgz" -C "$d" gitleaks
          sudo install "$d/gitleaks" /usr/local/bin/gitleaks
      - name: Scan history and tree (redacted)
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .
