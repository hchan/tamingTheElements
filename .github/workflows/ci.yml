name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; a push to main is never cancelled half way through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only changes skip the slow, docs-independent jobs (coverage, browser). check and e2e always run because
  # tests/repo checks markdown links and the repo map. A whole-workflow paths-ignore is deliberately NOT used: a skipped
  # workflow leaves required checks pending and docs edits can break `check`. See docs/DEPLOYMENT.md.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$HEAD_SHA" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # corepack must be enabled before setup-node so `cache: pnpm` finds pnpm
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm depcruise
      - run: corepack pnpm test
      # The legacy characterization suites are the parity oracle for the whole port; they must run on every change.
      - run: corepack pnpm test:legacy
      # Fixtures, goldens and the balance baseline may only change in a reviewed commit: nothing in the test run
      # above may modify them, so a dirty tree here means a test regenerated a fixture.
      - name: Fixtures unchanged by the test run
        run: git diff --exit-code -- tests/fixtures
      - run: corepack pnpm build
      - name: Bundle size budgets (tools/ci/size-budget.json)
        run: corepack pnpm size:check

  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Coverage (src/core thresholds enforced)
        run: corepack pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # Browser downloads and apt installs occasionally stall for minutes; cap each attempt and retry so a stall
      # costs ~5 minutes of Actions time, not the whole job timeout.
      - name: Install Playwright browsers (retry)
        run: |
          # Wait for the dpkg lock (unattended upgrades / a previous attempt) instead of failing on it.
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for attempt in 1 2; do
            timeout --kill-after=30 600 corepack pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"; sleep 10
          done
          exit 1
      - run: corepack pnpm e2e
      # Production build served under the Pages subpath (VITE_BASE=/tamingTheElements/).
      - run: corepack pnpm e2e:pages

  # Cross-engine determinism gate. Runs on every PR (not nightly): the replay is ~1500 ticks and the whole job
  # is dominated by the browser download (~1-2 min), cheap enough to catch a divergence before merge.
  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # Browser downloads and apt installs occasionally stall for minutes; cap each attempt and retry so a stall
      # costs ~5 minutes of Actions time, not the whole job timeout.
      - name: Install Playwright browsers (retry)
        run: |
          # Wait for the dpkg lock (unattended upgrades / a previous attempt) instead of failing on it.
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for attempt in 1 2; do
            timeout --kill-after=30 600 corepack pnpm exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install attempt $attempt failed or timed out"; sleep 10
          done
          exit 1
      - run: corepack pnpm test:browser

  # Deploy to GitHub Pages: push to main only, and only after check and e2e passed. PRs never reach these jobs.
  # Pages must be enabled (Source: GitHub Actions) in repo settings first; see docs/DEPLOYMENT.md.
  # The cross-browser determinism job is a dependency too, but it is skipped on docs-only runs, so the condition accepts
  # `skipped` and rejects only `failure` and `cancelled` (always() is needed or a skipped need would skip this job).
  pages-build:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.e2e.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped')
    needs: [check, e2e, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # short sha for the version stamp
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Build for Pages
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: corepack pnpm build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
