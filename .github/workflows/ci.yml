name: CI

# Owner decision (2026-11-17): Actions minutes are rationed. CI runs once a day on a schedule (plus manual dispatch), never per push.
# The per-commit check is the local gate (CLAUDE.md), which includes the Playwright e2e suites; e2e is deliberately NOT a job here.
# The deploy is gated by the nightly long gate (tools/ci/long-gate-status.json, read by tools/ci/long-gate-verdict.ts). While that
# file has enforce:false the verdict only warns and HEAD is deployed as before. e2e still never runs on Actions.
on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = 07:00 MST, after the nightly long gate (23:15 local) has recorded its result
  workflow_dispatch:
    inputs:
      ignore_long_gate:
        description: Deploy current main even if the nightly long gate is red, stale or missing
        type: boolean
        default: false

permissions:
  contents: read

# No cancel-in-progress: a scheduled or manual run is never cut off by another one. Runs queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # corepack must be enabled before setup-node so `cache: pnpm` finds pnpm
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm depcruise
      - run: corepack pnpm test
      # The legacy characterization suites are the parity oracle for the whole port; they must run on every change.
      - run: corepack pnpm test:legacy
      # Fixtures, goldens and the balance baseline may only change in a reviewed commit: nothing in the test run
      # above may modify them, so a dirty tree here means a test regenerated a fixture.
      - name: Fixtures unchanged by the test run
        run: git diff --exit-code -- tests/fixtures
      - run: corepack pnpm build
      - name: Bundle size budgets (tools/ci/size-budget.json)
        run: corepack pnpm size:check

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Coverage (src/core thresholds enforced)
        run: corepack pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # Cross-engine determinism gate. Runs in the daily run: the replay is ~1500 ticks and the whole job
  # is dominated by the browser download (~1-2 min), cheap enough to catch a divergence before merge.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # Browser downloads and apt installs occasionally stall for minutes; cap each attempt and retry so a stall
      # costs ~5 minutes of Actions time, not the whole job timeout.
      - name: Install Playwright browsers (retry)
        run: |
          # Wait for the dpkg lock (unattended upgrades / a previous attempt) instead of failing on it.
          echo 'DPkg::Lock::Timeout "90";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          for attempt in 1 2 3; do
            timeout --kill-after=30 240 corepack pnpm exec playwright install --with-deps chromium firefox webkit && exit 0
            echo "playwright install attempt $attempt failed or timed out"; sleep 10
          done
          exit 1
      - run: corepack pnpm test:browser

  # Deploy to GitHub Pages: only on the scheduled or manually dispatched run of main, and only after check, coverage and the
  # cross-browser determinism job passed. e2e runs locally (CLAUDE.md gate), not here.
  # Pages must be enabled (Source: GitHub Actions) in repo settings first; see docs/DEPLOYMENT.md.
  pages-build:
    if: github.ref == 'refs/heads/main'
    needs: [check, coverage, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.verdict.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # short sha for the version stamp
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Long gate verdict (tools/ci/long-gate-status.json)
        id: verdict
        env:
          IGNORE_LONG_GATE: ${{ inputs.ignore_long_gate }}
        run: corepack pnpm exec tsx tools/ci/long-gate-verdict.ts --github-output
      - name: Check out the last commit the long gate passed
        if: steps.verdict.outputs.deploy == 'true' && steps.verdict.outputs.sha != github.sha
        env:
          SHA: ${{ steps.verdict.outputs.sha }}
        run: git checkout --detach "$SHA" && corepack pnpm install --frozen-lockfile
      - name: Build for Pages
        if: steps.verdict.outputs.deploy == 'true'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: corepack pnpm build
      - if: steps.verdict.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.pages-build.outputs.deploy == 'true'
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
