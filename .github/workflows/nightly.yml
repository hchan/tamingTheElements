name: Nightly

# Full balance tournament diffed against the committed baseline, plus a heavier property-test profile.
# See docs/BALANCE.md and docs/TESTING.md. Not part of PR CI.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - name: Balance compare (fails when a race moves beyond the tolerance)
        run: corepack pnpm balance:compare --out out/balance-report.json
      - name: Property tests, heavy profile
        run: corepack pnpm test
        env:
          SIM_FUZZ_RUNS: '500'
          SIM_FUZZ_TICKS: '1500'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: balance-report
          path: out/balance-report.json
          if-no-files-found: ignore
