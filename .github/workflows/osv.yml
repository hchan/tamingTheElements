name: Dependency audit

# Non-blocking at first (continue-on-error). Policy in docs/SECURITY-GATES.md.
on:
  pull_request:
    paths: [pnpm-lock.yaml, package.json]
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, package.json]
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: pnpm audit (production dependencies)
        run: corepack pnpm audit --prod --audit-level high
      - name: OSV-Scanner on the lockfile
        if: always()
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
