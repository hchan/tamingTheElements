name: itch

# `build` builds and smoke-tests the itch.io HTML5 zip (tag v* or a manual dry run) and uploads it as an artifact.
# `publish` runs ONLY for refs/tags/v*, in the `itch` Environment that holds BUTLER_API_KEY, and only downloads that
# artifact: no checkout, no install, no build, so no node or dev dependency ever runs next to the key.
# A manual dispatch never publishes (it is a dry-run build).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: false

env:
  BUTLER_VERSION: 15.32.0
  # sha256 of https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default, recorded when this workflow was written
  BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
  # user-approval: confirm the itch.io account/game slug before the first publish
  ITCH_TARGET: hchan/taming-the-elements
  CHANNEL: html5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # Browser downloads and apt installs occasionally stall for minutes; cap each attempt and retry so a stall
      # costs ~5 minutes of Actions time, not the whole job timeout.
      - name: Install Playwright browsers (retry)
        run: |
          for attempt in 1 2 3; do
            timeout 300 corepack pnpm exec playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed or timed out"; sleep 10
          done
          exit 1
      - name: Build zip (size budget enforced)
        run: corepack pnpm build:itch
      - name: Smoke test the unzipped artifact
        run: corepack pnpm e2e:itch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itch-zip
          path: dist-itch/*.zip
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    # Never from workflow_dispatch or a branch: only a pushed v* tag can publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: itch # holds BUTLER_API_KEY; add required reviewers and a tag-only deployment rule here
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: itch-zip
          path: zip
      - name: Publish with butler (pinned, checksum verified)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${BUTLER_API_KEY}" ]; then
            echo "::notice::BUTLER_API_KEY is not set in the itch environment: skipping the publish. The zip is in the itch-zip artifact."
            exit 0
          fi
          curl -fsSL -o "${RUNNER_TEMP}/butler.zip" "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  ${RUNNER_TEMP}/butler.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/butler.zip" -d "${RUNNER_TEMP}/butler"
          chmod +x "${RUNNER_TEMP}/butler/butler"
          "${RUNNER_TEMP}/butler/butler" push zip/taming-the-elements-*.zip "${ITCH_TARGET}:${CHANNEL}" --userversion "${TAG#v}"
