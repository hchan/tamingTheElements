# Deploy: `npx wrangler deploy` from this folder (new free accounts need Durable Objects with SQLite, as below).
name = "tte-signal-relay"
main = "worker.ts"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
